# TenderOps AI local stack: postgres:17 + API server + nginx client.
# Start:  scripts/dev-up.ps1     (or .sh)      Stop: scripts/dev-down.ps1
# Full demo reset (never prod): scripts/full-reset.ps1
name: tenderops

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-tenderops}
      POSTGRES_USER: ${PG_USER:-tenderops}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-tenderops} -d ${PG_DB:-tenderops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      PG_URL: jdbc:postgresql://postgres:5432/${PG_DB:-tenderops}
      PG_USER: ${PG_USER:-tenderops}
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      TENDEROPS_STORAGE_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    restart: "no"
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tenderops.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
