server:
  port: 8080

spring:
  application:
    name: tenderops-server
  datasource:
    url: jdbc:h2:mem:tenderops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

tenderops:
  jwt:
    # No default: dev-like profiles generate an ephemeral secret at startup when empty;
    # non-dev profiles (postgres, prod) fail to start when empty (R9, TC-SEC-07).
    secret: ${JWT_SECRET:}
    expiry-hours: 12
  rate-limit:
    login-per-minute: 30
    register-per-minute: 10
    upload-per-minute: 20
  limits:
    max-pdf-bytes: 26214400
    max-pdf-pages: 200
  render:
    dpi: 150
  meta-api:
    base-url: ${META_API_BASE_URL:https://api.meta.ai/v1}
    responses-path: /responses
    key: ${MODEL_API_KEY:}
    muse-model: muse-spark-1.3
    sam-model: sam-3.1
    connect-timeout-ms: 10000
    request-timeout-ms: 60000
    max-attempts: 3
    backoff-initial-ms: 500
  muse:
    # Docs-verified capabilities (see AI_INTEGRATION.md); live behavior UNVERIFIED until probed.
    structured-output: true
    tool-calling: true
    image-input: true
  sam:
    mask-format: base85-lossless-or-onebit
  time-saved:
    baseline-minutes-per-page: 4.0
    review-minutes-per-item: 2.0
  rule-version: "1.0"
  storage-dir: ${TENDEROPS_STORAGE_DIR:./data/storage}
  seeder:
    enabled: true
  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
