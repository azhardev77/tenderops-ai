# PostgreSQL profile (compose + prod-like native runs). Flyway owns the schema from
# V1 upward; Hibernate only validates. All secrets come from the environment.
spring:
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/tenderops}
    username: ${PG_USER:tenderops}
    password: ${PG_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

# Demo endpoints and the auto-seeder stay off under this profile (see DemoController
# @Profile and DemoDataSeeder.shouldSeed); demo data arrives via scripts/seed-demo.
